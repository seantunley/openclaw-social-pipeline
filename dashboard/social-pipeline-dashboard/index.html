<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw Social Pipeline</title>
    <script>
      // Resolve theme BEFORE first paint to avoid a flash. Reads stored
      // preference, falls back to system. Must stay in sync with the
      // STORAGE_KEY and class names in src/lib/theme.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('social-pipeline-theme');
          var prefersLight =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : prefersLight
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          if (theme === 'light') {
            root.classList.add('theme-light');
          } else {
            root.classList.add('theme-dark', 'dark');
          }
        } catch (e) {
          document.documentElement.classList.add('theme-dark', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
